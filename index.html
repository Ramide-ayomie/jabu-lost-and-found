<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JABU Lost and Found</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f4f6fa;

            margin: 0;

            padding: 0;

        }

        header {

            background-color: #142b4a;

            color: white;

            padding: 25px;

            text-align: center;

        }

        .container {

            text-align: center;

            margin: 70px auto;

            padding: 30px;

        }

        h2 {

            color: #142b4a;

        }

        p {

            color: #555;

            font-size: 16px;

        }

        button {

            background-color: #142b4a;

            color: white;

            border: none;

            padding: 15px 25px;

            margin: 10px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

        }

        button:hover {

            background-color: #d6a84f;

            color: #142b4a;

        }

        footer {

            text-align: center;

            padding: 20px;

            color: #777;

        }

        /* Responsive design for phones and tablets */

@media screen and (max-width: 768px) {

    header {
        padding: 18px 10px;
    }

    header h1 {
        font-size: 23px;
    }

    .container {
        margin: 25px 15px;
        padding: 20px 15px;
    }

    h2 {
        font-size: 21px;
    }

    p {
        font-size: 14px;
        line-height: 1.6;
    }

    button {
        width: 100%;
        margin: 10px 0;
        padding: 14px;
    }

    footer {
        font-size: 13px;
    }

}

    </style>
    

</head>

<body>

    <header>

        <h1>JABU LOST AND FOUND</h1>

        <p>Joseph Ayo Babalola University</p>

    </header>

    <div class="container">

        <h2>Welcome to JABU Lost and Found</h2>

        <p>

            Lost something on campus?

            Found something that belongs to someone else?

        </p>

        <p>

            Our platform helps students and staff

            report, search and recover lost belongings.

        </p>

        <button onclick="window.location.href= 'lost.html'">

            Report Lost Item

        </button>

        <button onclick="window.location.href= 'found.html'">

            Report Found Item

        </button>

    </div>

    <footer>

        <p>© 2026 JABU Lost and Found Management System</p>
