<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item | JABU</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6fa;

            margin: 0;

        }

        header {

            background: #142b4a;

            color: white;

            text-align: center;

            padding: 20px;

        }

        .container {

            background: white;

            max-width: 550px;

            margin: 35px auto;

            padding: 25px;

            border-radius: 10px;

        }

        h2 {

            color: #142b4a;

            text-align: center;

        }

        label {

            display: block;

            margin-top: 15px;

            font-weight: bold;

        }

        input, select, textarea {

            width: 100%;

            padding: 11px;

            margin-top: 7px;

            border: 1px solid #ccc;

            border-radius: 5px;

            box-sizing: border-box;

        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 20px;

            background: #142b4a;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

        }

        /* Responsive design for phones and tablets */

@media screen and (max-width: 768px) {

    header {
        padding: 18px 10px;
    }

    header h1 {
        font-size: 23px;
    }

    .container {
        width: auto;
        margin: 20px 12px;
        padding: 20px 15px;
        box-sizing: border-box;
    }

    h2 {
        font-size: 21px;
    }

    label {
        font-size: 14px;
    }

    input,
    select,
    textarea {
        width: 100%;
        font-size: 16px;
        padding: 12px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 15px;
        font-size: 15px;
    }

    a {
        font-size: 14px;
    }

}

    </style>

</head>

<body>

<header>

    <h1>JABU LOST AND FOUND</h1>

</header>

<div class="container">

    <h2>Report a Lost Item</h2>

    <form onsubmit="submitReport(event)">

        <label>Item Name</label>

        <input type="text" placeholder="e.g. Black wallet" required>

        <label>Item Category</label>

        <select required>

            <option value="">Select category</option>

            <option>Electronics</option>

            <option>Books</option>

            <option>Clothing</option>

            <option>Personal Belongings</option>

            <option>Other</option>

        </select>

        <label>Item Colour</label>

        <input type="text" placeholder="e.g. Black">

        <label>Description</label>

        <textarea placeholder="Describe the lost item" required></textarea>

        <label>Location Last Seen</label>

        <input type="text" placeholder="e.g. University Library" required>

        <label>Date Lost</label>

        <input type="date" required>

        <button type="submit">Submit Lost Item Report</button>

    </form>

     <p style="text-align:center;">

        <a href="index.html">Back to Homepage</a>

    </p>

</div>

<script>

    function submitReport(event) {

        event.preventDefault();
        alert("Your lost item report has been submitted         successfully!");}


</script>
</body>
</html>
